
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="chatbot-container">
        <div id="chatbot-fab">
            <span>&#128172;</span>
        </div>
        <div id="chatbot-window" class="hidden">
            <div id="chatbot-header">
                <h3>Student Analysis Bot</h3>
                <span id="chatbot-close">&times;</span>
            </div>
            <div id="chatbot-messages"></div>
            <div id="chatbot-input-container">
                <input type="text" id="chatbot-input" placeholder="Enter student name or ID...">
                <button id="chatbot-send">Send</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@2/dist/streamlit-component-lib.js"></script>
    <script src="script.js"></script>
</body>
</html>
